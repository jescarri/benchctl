# Generator CH1 → scope C1 smoke test, plus the external 5 V on the DMM.
# Run: benchctl apply examples/fg-scope-smoke.yaml
name: fg-scope-smoke
safe_on_exit: true          # switch every output off when the plan ends
# Cabling this plan needs. `benchctl wiring show --plan` prints instructions for
# the human; `apply` verifies it electrically before step 1 (verify_wiring: false
# to skip).
wiring:
  - {from: "fg:CH1", to: "scope:C1"}
  - {from: "ext:5V", to: "dmm:V", expect: {function: vdc, value: 5, tolerance: "5%"}, note: "bench PSU"}
steps:
  - fg.set:         {ch: 1, wave: sine, freq: 1k, amp: 1Vpp, offset: 0, load: hiz}
  - scope.setup:    {ch: 1, vdiv: 200m, offset: 0, coupling: dc, probe: 1x, on: true}
  - scope.timebase: {tdiv: 2m, delay: 0}
  - scope.trigger:  {source: C1, mode: auto, level: 0, slope: rise}
  - fg.output:      {ch: 1, state: on}
  - wait: 2s
  - scope.measure:
      ch: 1
      params: [ampl, rms, pkpk, freq]
      expect: {ampl: "1 ± 3%", rms: "353.6m ± 3%", freq: "1k ± 0.1%"}
  - scope.capture:  {ch: 1, points: 20000, out: c1.csv, expect: {fft_peak_hz: "1k ± 0.5%"}}
  - dmm.config:     {function: vdc, range: auto}
  - dmm.read:       {samples: 5, interval: 100ms, expect: "5 ± 5%"}
